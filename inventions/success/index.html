<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Scarlet's Workshop</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg: #0a0e14; --bg-soft: #0f1520;
    --card: rgba(255,255,255,0.045); --card-border: rgba(255,255,255,0.09);
    --text: #e8edf4; --muted: #8b95a5;
    --accent: #4fd8ff; --accent-2: #a06bff; --ok: #46d38a;
    --radius: 16px;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(79,216,255,0.13), transparent);
  }
  .wrap{ max-width: 620px; margin: 0 auto; padding: 64px 20px 90px; }
  .mark{
    width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06121a; margin-bottom: 20px;
  }
  h1{ font-size: 28px; margin-bottom: 8px; }
  .sub{ color: var(--muted); margin-bottom: 28px; }
  .card{ background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
  .card h2{ font-size: 14px; color: var(--accent); margin-bottom: 14px; letter-spacing: 0.3px; }
  .dl{ display: flex; flex-direction: column; gap: 10px; }
  .dl a{
    display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text);
    border: 1px solid var(--card-border); border-radius: 12px; padding: 13px 16px; transition: all .18s;
  }
  .dl a:hover{ border-color: var(--accent); background: rgba(79,216,255,0.06); }
  .dl a[aria-disabled="true"]{ opacity: .55; pointer-events: none; }
  .dl .ext{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700;
    color: var(--accent); background: rgba(79,216,255,0.1); border: 1px solid rgba(79,216,255,0.28);
    padding: 3px 8px; border-radius: 6px; min-width: 52px; text-align: center;
  }
  .dl .arrow{ margin-left: auto; color: var(--muted); }
  .note{ font-size: 13px; color: var(--muted); margin-top: 6px; }
  .back{ display: inline-block; margin-top: 22px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 8px 16px; border: 1px solid var(--card-border); border-radius: 999px; }
  .back:hover{ color: var(--accent); border-color: var(--accent); }
  .state{ color: var(--muted); padding: 30px 0; }
  .state.bad{ color: #ff8484; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><p class="state">Confirming your order…</p></div>
  <a class="back" href="../../">← Back to Scarlet's Workshop</a>
</div>

<script src="../config.js"></script>
<script>
const API_BASE = (window.WORKSHOP_API || "").replace(/\/$/, "");
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const sessionId = params.get("session_id");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const extOf = f => (String(f).split(".").pop() || "").toUpperCase().slice(0, 5);

if (!sessionId) {
  app.innerHTML = '<p class="state bad">No order reference in the link. If you just paid, check your email for the receipt.</p>';
} else if (!API_BASE) {
  app.innerHTML = '<p class="state bad">Download service is not configured yet.</p>';
} else {
  fetch(`${API_BASE}/api/verify?session_id=${encodeURIComponent(sessionId)}`)
    .then(r => r.json().catch(() => ({})))
    .then(data => {
      if (!data || !data.paid) throw new Error(data && data.error || "not paid");
      render(data);
    })
    .catch(() => {
      app.innerHTML = '<p class="state bad">We couldn’t confirm this order automatically. Your receipt email has the files, or reply to it and Scarlet will sort it out.</p>';
    });
}

function render(data){
  const dls = Array.isArray(data.downloads) ? data.downloads : [];
  app.innerHTML = `
    <div class="mark">✓</div>
    <h1>Thanks${data.buyerName ? ", " + esc(data.buyerName.split(" ")[0]) : ""} — you're all set</h1>
    <p class="sub">Your purchase of <strong>${esc(data.name || "your invention")}</strong> is confirmed. A receipt is on its way to your email.</p>
    <div class="card">
      <h2>Your downloads</h2>
      <div class="dl">
        ${dls.length ? dls.map(d => `
          <a href="${esc(d.url || "#")}" ${d.url ? "download" : 'aria-disabled="true"'}>
            <span class="ext">${esc(extOf(d.file || d.label))}</span>
            <span>${esc(d.label || d.file)}</span>
            <span class="arrow">↓</span>
          </a>`).join("") : '<p class="note">Files are being prepared — check your receipt email.</p>'}
      </div>
      <p class="note">Keep this page bookmarked${data.windowDays ? ` — the links stay valid for ${Number(data.windowDays)} days` : " — the links stay valid"}.</p>
    </div>`;
}
</script>
</body>
</html>
