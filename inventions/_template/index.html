<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invention — Scarlet's Workshop</title>
<meta name="description" content="An invention from Scarlet's Workshop — CAD, STL and PDF downloads.">
<style>
  :root{
    --bg: #0a0e14; --bg-soft: #0f1520;
    --card: rgba(255,255,255,0.045); --card-border: rgba(255,255,255,0.09); --card-hover: rgba(255,255,255,0.08);
    --text: #e8edf4; --muted: #8b95a5;
    --accent: #FF4A63; --accent-2: #ff7a5c;
    --ok: #46d38a;
    --radius: 16px;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(255,74,99,0.13), transparent);
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 40px 20px 90px; }
  .back{
    display: inline-block; text-decoration: none; color: var(--muted);
    font-size: 14px; font-weight: 600; margin-bottom: 28px;
    padding: 8px 16px; border: 1px solid var(--card-border); border-radius: 999px; transition: all .2s;
  }
  .back:hover{ color: var(--accent); border-color: var(--accent); }

  .hero-emoji{ font-size: 40px; margin-bottom: 10px; }
  h1{ font-size: 30px; margin-bottom: 8px; letter-spacing: 0.3px; }
  h1 span{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline{ color: var(--muted); font-size: 16px; margin-bottom: 26px; }

  /* gallery */
  .gallery{ margin-bottom: 26px; }
  .gallery-main{
    width: 100%; aspect-ratio: 4/3; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(135deg, rgba(255,74,99,0.14), rgba(255,122,92,0.14));
    border: 1px solid var(--card-border); display: grid; place-items: center;
  }
  .gallery-main img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-main .placeholder{ font-size: 64px; }
  .thumbs{ display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .thumbs button{
    width: 68px; height: 68px; padding: 0; border-radius: 10px; overflow: hidden; cursor: pointer;
    border: 1px solid var(--card-border); background: var(--bg-soft); transition: border-color .18s;
  }
  .thumbs button.active{ border-color: var(--accent); }
  .thumbs img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  .card{ background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
  .card h2{ font-size: 15px; margin-bottom: 12px; color: var(--accent); letter-spacing: 0.3px; }
  .desc p{ margin-bottom: 12px; }
  .desc p:last-child{ margin-bottom: 0; }

  .includes{ list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .includes li{ display: flex; align-items: center; gap: 12px; font-size: 14.5px; }
  .includes .ext{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700;
    color: var(--accent); background: rgba(255,74,99,0.1); border: 1px solid rgba(255,74,99,0.28);
    padding: 3px 8px; border-radius: 6px; flex: 0 0 auto; min-width: 52px; text-align: center;
  }

  /* buy bar */
  .buybar{
    position: sticky; bottom: 16px; margin-top: 26px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: rgba(10,14,20,0.9); backdrop-filter: blur(10px);
    border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px 18px;
  }
  .price{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 700; font-size: 22px; color: var(--accent); }
  .buy{
    margin-left: auto; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    color: #2A0810; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: 999px; padding: 13px 28px; transition: transform .15s, filter .15s, opacity .15s;
  }
  .buy:hover{ transform: translateY(-1px); filter: brightness(1.06); }
  .buy:disabled{ opacity: 0.6; cursor: default; transform: none; }
  .buy-note{ flex-basis: 100%; font-size: 12px; color: var(--muted); }
  .err{ flex-basis: 100%; font-size: 13px; color: #ff8484; }

  .loading, .fail{ color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">← Back to Scarlet's Workshop</a>
  <div id="app"><p class="loading">Loading…</p></div>
</div>

<script src="../config.js"></script>
<script>
const API_BASE = (window.WORKSHOP_API || "").replace(/\/$/, "");
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtPrice = p => {
  const amt = (p.price || 0) / 100;
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: (p.currency || "usd").toUpperCase() }).format(amt); }
  catch { return "$" + amt.toFixed(2); }
};
const extOf = f => (String(f).split(".").pop() || "").toUpperCase().slice(0, 5);

fetch("./product.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error("product.json missing"); return r.json(); })
  .then(render)
  .catch(() => { app.innerHTML = '<p class="fail">This invention page is not set up yet.</p>'; });

function render(p){
  document.title = `${p.name} — Scarlet's Workshop`;
  const md = document.querySelector('meta[name="description"]');
  if (md && p.tagline) md.content = p.tagline;

  const imgs = Array.isArray(p.images) ? p.images : [];
  const gallery = `
    <div class="gallery">
      <div class="gallery-main" id="gmain">
        ${imgs.length ? `<img src="${esc(imgs[0])}" alt="${esc(p.name)}" id="gimg">` : `<span class="placeholder">${esc(p.emoji || "🛠️")}</span>`}
      </div>
      ${imgs.length > 1 ? `<div class="thumbs" id="thumbs">${imgs.map((src, i) =>
        `<button class="${i === 0 ? "active" : ""}" data-src="${esc(src)}"><img src="${esc(src)}" alt=""></button>`).join("")}</div>` : ""}
    </div>`;

  const paragraphs = String(p.description || "").split(/\n\s*\n/).filter(Boolean);
  const descCard = paragraphs.length
    ? `<div class="card desc"><h2>About</h2>${paragraphs.map(t => `<p>${esc(t)}</p>`).join("")}</div>` : "";

  const dls = Array.isArray(p.downloads) ? p.downloads : [];
  const includesCard = dls.length ? `
    <div class="card">
      <h2>What you get</h2>
      <ul class="includes">${dls.map(d =>
        `<li><span class="ext">${esc(extOf(d.file || d.label))}</span><span>${esc(d.label || d.file)}</span></li>`).join("")}</ul>
    </div>` : "";

  const canBuy = !!API_BASE && (p.price > 0);
  app.innerHTML = `
    <div class="hero-emoji">${esc(p.emoji || "🛠️")}</div>
    <h1><span>${esc(p.name)}</span></h1>
    <p class="tagline">${esc(p.tagline || "")}</p>
    ${gallery}
    ${descCard}
    ${includesCard}
    <div class="buybar">
      <span class="price">${fmtPrice(p)}</span>
      <button class="buy" id="buy" ${canBuy ? "" : "disabled"}>Buy${p.price > 0 ? " — instant download" : ""}</button>
      ${!API_BASE ? '<span class="buy-note">Checkout not configured yet — set the API URL in inventions/config.js.</span>'
        : '<span class="buy-note">Secure checkout via Stripe. Files delivered on the confirmation page.</span>'}
      <span class="err" id="err" hidden></span>
    </div>`;

  const thumbs = document.getElementById("thumbs");
  if (thumbs) thumbs.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.getElementById("gimg").src = b.dataset.src;
    thumbs.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
  });

  const buy = document.getElementById("buy");
  const err = document.getElementById("err");
  if (buy) buy.addEventListener("click", async () => {
    err.hidden = true;
    buy.disabled = true; buy.textContent = "Starting checkout…";
    try {
      const r = await fetch(`${API_BASE}/api/checkout`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ slug: p.slug }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.url) throw new Error(data.error || `checkout failed (${r.status})`);
      location.href = data.url;
    } catch (e) {
      buy.disabled = false; buy.textContent = "Buy — instant download";
      err.textContent = "Could not start checkout: " + e.message;
      err.hidden = false;
    }
  });
}
</script>
</body>
</html>
