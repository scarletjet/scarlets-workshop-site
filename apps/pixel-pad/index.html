<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelPad — Scarlet's Workshop</title>
<meta name="description" content="Sketch anywhere: a freehand drawing pad that autosaves in your browser. Pick a color, pick a size, draw.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FF6B4A'/><stop offset='1' stop-color='%237A0F22'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><text x='50' y='68' font-size='48' font-weight='800' font-family='sans-serif' text-anchor='middle' fill='%23fff'>SW</text></svg>">
<style>
  :root{
    --bg: #0a0e14; --card: rgba(255,255,255,0.045); --card-border: rgba(255,255,255,0.09);
    --text: #e8edf4; --muted: #8b95a5;
    --accent: #c04fd6; --accent-2: #ff9ecf;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(192,79,214,0.14), transparent);
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  .back{
    display: inline-block; text-decoration: none; color: var(--muted);
    font-size: 14px; font-weight: 600; margin-bottom: 32px;
    padding: 8px 16px; border: 1px solid var(--card-border); border-radius: 999px;
    transition: all .2s;
  }
  .back:hover{ color: var(--accent); border-color: var(--accent); }
  h1{ font-size: 30px; margin-bottom: 8px; }
  h1 span{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub{ color: var(--muted); margin-bottom: 24px; }

  .toolbar{
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .group{ display: flex; align-items: center; gap: 8px; }
  .swatches{ display: flex; gap: 6px; }
  .swatch{
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; transition: transform .12s, border-color .12s;
  }
  .swatch:hover{ transform: scale(1.1); }
  .swatch.active{ border-color: #fff; }
  input[type="color"]{
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--card-border);
    background: none; cursor: pointer; padding: 0;
  }
  input[type="range"]{ width: 90px; accent-color: var(--accent); }
  .size-label{ font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }

  .tool-btn{
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--muted); background: transparent; border: 1px solid var(--card-border);
    border-radius: 8px; padding: 7px 12px; transition: all .15s;
  }
  .tool-btn.active{ color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .tool-btn:hover:not(.active){ color: var(--text); border-color: var(--accent); }

  .spacer{ flex: 1; }

  .canvas-wrap{
    background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid var(--card-border);
    touch-action: none; box-shadow: 0 12px 40px -18px rgba(0,0,0,.6);
  }
  canvas{ display: block; width: 100%; height: auto; cursor: crosshair; }

  .foot-row{ display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .note{ font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">← Back to Scarlet's Workshop</a>
  <h1><span>PixelPad</span></h1>
  <p class="sub">Sketch anywhere — it autosaves right in this browser.</p>

  <div class="toolbar">
    <div class="group">
      <button class="tool-btn active" data-tool="brush">Brush</button>
      <button class="tool-btn" data-tool="eraser">Eraser</button>
    </div>
    <div class="group swatches" id="swatches"></div>
    <div class="group">
      <input type="color" id="custom-color" value="#c04fd6" aria-label="Custom color">
    </div>
    <div class="group">
      <input type="range" id="size" min="1" max="40" value="6">
      <span class="size-label" id="size-label">6px</span>
    </div>
    <div class="spacer"></div>
    <button class="tool-btn" id="undo-btn">Undo</button>
    <button class="tool-btn" id="clear-btn">Clear</button>
    <button class="tool-btn" id="save-btn">Save PNG</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="pad" width="1200" height="900"></canvas>
  </div>
  <p class="note">Drawings save automatically to this browser. Clear starts a fresh page.</p>
</div>

<script>
(function(){
  const STORAGE_KEY = "pixelpad-drawing-v1";
  const canvas = document.getElementById("pad");
  const ctx = canvas.getContext("2d");
  const swatchesEl = document.getElementById("swatches");
  const customColor = document.getElementById("custom-color");
  const sizeInput = document.getElementById("size");
  const sizeLabel = document.getElementById("size-label");
  const undoBtn = document.getElementById("undo-btn");
  const clearBtn = document.getElementById("clear-btn");
  const saveBtn = document.getElementById("save-btn");
  const toolBtns = Array.from(document.querySelectorAll(".tool-btn[data-tool]"));

  const COLORS = ["#1b1517", "#ffffff", "#e0475a", "#f2b13a", "#3ab6a0", "#4f7fd6", "#c04fd6", "#ff9ecf"];
  let color = "#c04fd6";
  let size = 6;
  let tool = "brush";
  let drawing = false;
  let last = null;
  const undoStack = [];
  const UNDO_LIMIT = 25;

  function dpr(){ return Math.min(window.devicePixelRatio || 1, 2); }

  function fitCanvas(){
    const cssWidth = canvas.parentElement.clientWidth;
    const ratio = canvas.height / canvas.width;
    canvas.style.height = (cssWidth * ratio) + "px";
  }

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function pushUndo(){
    try {
      undoStack.push(canvas.toDataURL());
      if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    } catch(e){}
  }

  function restore(dataUrl, cb){
    const img = new Image();
    img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img, 0, 0); if (cb) cb(); };
    img.src = dataUrl;
  }

  function persist(){
    try { localStorage.setItem(STORAGE_KEY, canvas.toDataURL()); } catch(e){}
  }

  function startStroke(e){
    drawing = true;
    pushUndo();
    last = pos(e);
    drawDot(last);
  }
  function moveStroke(e){
    if (!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = tool === "eraser" ? "#ffffff" : color;
    ctx.lineWidth = size * (canvas.width / canvas.getBoundingClientRect().width) / dpr() * dpr();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function drawDot(p){
    ctx.fillStyle = tool === "eraser" ? "#ffffff" : color;
    const r = (size * (canvas.width / canvas.getBoundingClientRect().width)) / 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function endStroke(){
    if (!drawing) return;
    drawing = false;
    persist();
  }

  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); startStroke(e); });
  canvas.addEventListener("pointermove", moveStroke);
  window.addEventListener("pointerup", endStroke);
  window.addEventListener("pointercancel", endStroke);

  swatchesEl.innerHTML = COLORS.map((c,i) => `<button class="swatch${i===6?" active":""}" style="background:${c}" data-color="${c}" aria-label="Color ${c}"></button>`).join("");
  swatchesEl.addEventListener("click", e => {
    const btn = e.target.closest(".swatch");
    if (!btn) return;
    color = btn.dataset.color;
    customColor.value = color;
    swatchesEl.querySelectorAll(".swatch").forEach(s => s.classList.toggle("active", s === btn));
  });
  customColor.addEventListener("input", () => {
    color = customColor.value;
    swatchesEl.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
  });

  sizeInput.addEventListener("input", () => {
    size = Number(sizeInput.value);
    sizeLabel.textContent = size + "px";
  });

  toolBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      tool = btn.dataset.tool;
      toolBtns.forEach(b => b.classList.toggle("active", b === btn));
    });
  });

  undoBtn.addEventListener("click", () => {
    const prev = undoStack.pop();
    if (prev) restore(prev, persist);
  });

  clearBtn.addEventListener("click", () => {
    if (!confirm("Clear the whole drawing?")) return;
    pushUndo();
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    persist();
  });

  saveBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "pixelpad-" + Date.now() + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });

  // init
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) restore(saved);
  } catch(e){}
  fitCanvas();
  window.addEventListener("resize", fitCanvas);
})();
</script>
</body>
</html>
