<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskPilot — Scarlet's Workshop</title>
<meta name="description" content="To-do, simplified: add a task, check it off, and move on. Nothing else to configure.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FF6B4A'/><stop offset='1' stop-color='%237A0F22'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><text x='50' y='68' font-size='48' font-weight='800' font-family='sans-serif' text-anchor='middle' fill='%23fff'>SW</text></svg>">
<style>
  :root{
    --bg: #0a0e14; --card: rgba(255,255,255,0.045); --card-border: rgba(255,255,255,0.09);
    --text: #e8edf4; --muted: #8b95a5;
    --accent: #22b573; --accent-2: #7fe0ae;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(34,181,115,0.14), transparent);
  }
  .wrap{ max-width: 520px; margin: 0 auto; padding: 48px 20px 80px; }
  .back{
    display: inline-block; text-decoration: none; color: var(--muted);
    font-size: 14px; font-weight: 600; margin-bottom: 32px;
    padding: 8px 16px; border: 1px solid var(--card-border); border-radius: 999px;
    transition: all .2s;
  }
  .back:hover{ color: var(--accent); border-color: var(--accent); }
  h1{ font-size: 30px; margin-bottom: 8px; }
  h1 span{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub{ color: var(--muted); margin-bottom: 26px; }

  .add-row{ display: flex; gap: 10px; margin-bottom: 18px; }
  .add-row input{
    flex: 1; font: inherit; font-size: 15px; color: var(--text);
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 13px 16px; outline: none; transition: border-color .15s;
  }
  .add-row input:focus{ border-color: var(--accent); }
  .add-row button{
    font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    color: #06231a; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: 12px; padding: 0 20px; transition: filter .15s;
  }
  .add-row button:hover{ filter: brightness(1.08); }

  .filters{ display: flex; gap: 6px; margin-bottom: 16px; }
  .filter-btn{
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    color: var(--muted); background: transparent; border: 1px solid var(--card-border);
    border-radius: 999px; padding: 6px 14px; transition: all .15s;
  }
  .filter-btn.active{ color: var(--bg); background: var(--accent); border-color: var(--accent); }

  .list{ list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .task{
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 12px 14px;
  }
  .task .chk{
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid var(--card-border); background: transparent; cursor: pointer;
    display: grid; place-items: center; transition: all .15s; color: transparent;
  }
  .task.done .chk{ background: var(--accent); border-color: var(--accent); color: #06231a; }
  .task-text{
    flex: 1; min-width: 0; font-size: 14.5px; cursor: text; word-break: break-word;
    outline: none;
  }
  .task.done .task-text{ color: var(--muted); text-decoration: line-through; }
  .task-del{
    flex: 0 0 auto; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; padding: 2px 4px; line-height: 1; transition: color .15s;
  }
  .task-del:hover{ color: #ff8484; }

  .empty{ text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }

  .footer-row{
    display: flex; align-items: center; justify-content: space-between;
    color: var(--muted); font-size: 13px;
  }
  .footer-row button{
    font: inherit; font-size: 13px; color: var(--muted); background: none; border: none;
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  .footer-row button:hover{ color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">← Back to Scarlet's Workshop</a>
  <h1><span>TaskPilot</span></h1>
  <p class="sub">To-do, simplified. Add a task, check it off, move on.</p>

  <form class="add-row" id="add-form">
    <input id="add-input" type="text" placeholder="What needs doing?" autocomplete="off" maxlength="200">
    <button type="submit">Add</button>
  </form>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>Nothing here — add your first task above.</p>

  <div class="footer-row">
    <span id="count">0 left</span>
    <button id="clear-done" type="button">Clear completed</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = "taskpilot-tasks-v1";
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const form = document.getElementById("add-form");
  const input = document.getElementById("add-input");
  const filtersEl = document.getElementById("filters");
  const clearBtn = document.getElementById("clear-done");

  let filter = "all";
  let tasks = load();

  function load(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch(e){ return []; }
  }
  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch(e){}
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  function visibleTasks(){
    if (filter === "active") return tasks.filter(t => !t.done);
    if (filter === "done") return tasks.filter(t => t.done);
    return tasks;
  }

  function render(){
    const vis = visibleTasks();
    listEl.innerHTML = vis.map(t => `
      <li class="task${t.done ? " done" : ""}" data-id="${t.id}">
        <button class="chk" aria-label="Toggle complete">✓</button>
        <div class="task-text" contenteditable="true" spellcheck="false">${esc(t.text)}</div>
        <button class="task-del" aria-label="Delete task">×</button>
      </li>`).join("");
    emptyEl.hidden = vis.length > 0;
    const left = tasks.filter(t => !t.done).length;
    countEl.textContent = left + (left === 1 ? " left" : " left");
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: uid(), text, done: false });
    input.value = "";
    save(); render();
  });

  listEl.addEventListener("click", e => {
    const li = e.target.closest(".task");
    if (!li) return;
    const id = li.dataset.id;
    if (e.target.closest(".chk")) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; save(); render(); }
    } else if (e.target.closest(".task-del")) {
      tasks = tasks.filter(t => t.id !== id);
      save(); render();
    }
  });

  listEl.addEventListener("blur", e => {
    const div = e.target.closest(".task-text");
    if (!div) return;
    const li = div.closest(".task");
    const t = tasks.find(t => t.id === li.dataset.id);
    const text = div.textContent.trim();
    if (t) {
      if (!text) { tasks = tasks.filter(x => x.id !== t.id); }
      else { t.text = text; }
      save(); render();
    }
  }, true);

  listEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList.contains("task-text")) {
      e.preventDefault();
      e.target.blur();
    }
  });

  filtersEl.addEventListener("click", e => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    filter = btn.dataset.filter;
    filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });

  clearBtn.addEventListener("click", () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
