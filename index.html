<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet's Workshop — Apps · Art · Webpages</title>
<meta name="description" content="Scarlet's Workshop creates apps, art, and webpages that are convenient to use. Browse deployed apps, live webpages, inventions with CAD/STL/PDF downloads, and works for sale on Gumroad and Etsy.">
<link rel="canonical" href="https://scarletsworkshop.live/">
<meta property="og:title" content="Scarlet's Workshop — Apps · Art · Webpages">
<meta property="og:description" content="Apps, art & webpages built to be convenient. Inventions you can download, plus works for sale on Gumroad and Etsy.">
<meta property="og:url" content="https://scarletsworkshop.live/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FF6B4A'/><stop offset='1' stop-color='%237A0F22'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><text x='50' y='68' font-size='48' font-weight='800' font-family='sans-serif' text-anchor='middle' fill='%23fff'>SW</text></svg>">
<style>
  :root{
    --paper: #FBF3EC;
    --paper-soft: #F2E3D6;
    --surface: #FFFFFF;
    --ink: #201512;
    --ink-soft: #6B5951;
    --scarlet: #C81E3A;
    --scarlet-ink: #FFFFFF;
    --garnet: #4B0D1B;
    --garnet-soft: #6B1526;
    --gold: #B87A22;
    --line: #E4D2C1;
    --shadow: 0 1px 2px rgba(32,21,18,0.06), 0 8px 24px -12px rgba(32,21,18,0.18);
    --gumroad: #ff90e8;
    --etsy: #f1641e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #150E0C;
      --paper-soft: #1F1512;
      --surface: #221714;
      --ink: #F3E7DE;
      --ink-soft: #B4A099;
      --scarlet: #FF4A63;
      --scarlet-ink: #1A0509;
      --garnet: #2A0810;
      --garnet-soft: #3D0F19;
      --gold: #E0A94E;
      --line: #3A2A24;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper: #150E0C;
    --paper-soft: #1F1512;
    --surface: #221714;
    --ink: #F3E7DE;
    --ink-soft: #B4A099;
    --scarlet: #FF4A63;
    --scarlet-ink: #1A0509;
    --garnet: #2A0810;
    --garnet-soft: #3D0F19;
    --gold: #E0A94E;
    --line: #3A2A24;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  .gutter{ padding-inline: 20px; }
  .stack{ max-width: 1080px; margin-inline: auto; }
  .stack-narrow{ max-width: 720px; margin-inline: auto; }
  img{ max-width: 100%; }
  h1,h2,h3{ font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3px; text-wrap: balance; margin: 0; }
  a{ color: inherit; }
  button{ font-family: inherit; }
  .mono{ font-family: "IBM Plex Mono", ui-monospace, monospace; }

  /* ---------- header / nav ---------- */
  header.bar{
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--garnet);
    color: #F6E9E2;
    border-bottom: 1px solid rgba(0,0,0,0.25);
  }
  .bar-inner{
    max-width: 1080px; margin-inline: auto; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand{ display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F6E9E2; }
  .brand-mark{
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--scarlet), #ff7a5c);
    display: grid; place-items: center;
    font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 15px; color: #2A0810;
  }
  .brand-name{ font-family: "Big Shoulders Display", sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.4px; text-transform: uppercase; }
  nav.pills{ display: flex; gap: 4px; }
  nav.pills a{
    text-decoration: none; color: #E9CFC4; font-size: 13px; font-weight: 600;
    padding: 7px 13px; border-radius: 999px; transition: background .15s, color .15s;
    white-space: nowrap;
  }
  nav.pills a:hover{ background: rgba(255,255,255,0.08); color: #fff; }
  nav.pills a[aria-current="page"]{ background: var(--scarlet); color: #fff; }
  @media (max-width: 700px){
    .bar-inner{ padding-block: 12px; }
    nav.pills{
      display: flex; overflow-x: auto; max-width: 58vw;
      -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent);
      mask-image: linear-gradient(90deg, #000 85%, transparent);
      scrollbar-width: none;
    }
    nav.pills::-webkit-scrollbar{ display: none; }
  }
  @media (max-width: 480px){
    .bar-inner{ padding-inline: 16px; }
    .brand-name{ display: none; }
    .brand-mark{ width: 34px; height: 34px; font-size: 16px; }
    nav.pills{ max-width: 72vw; gap: 2px; }
    nav.pills a{ font-size: 12.5px; padding: 6px 10px; }
  }

  /* ---------- page head (non-home routes) ---------- */
  .page-head{ padding-block: 40px 8px; }
  .page-head .eyebrow{ margin-bottom: 10px; }
  .page-head h1{ font-size: clamp(32px, 5vw, 48px); line-height: 1; }
  .page-head p{ color: var(--ink-soft); font-size: 16px; max-width: 56ch; margin-top: 14px; }
  @media (max-width: 480px){ .page-head{ padding-block: 28px 4px; } }

  /* ---------- hero (home) ---------- */
  .hero{ padding-block: 56px 48px; }
  @media (max-width: 480px){ .hero{ padding-block: 32px 28px; } }
  .hero-grid{ display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
  @media (max-width: 780px){ .hero-grid{ grid-template-columns: 1fr; } }
  .eyebrow{
    font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 1.5px;
    color: var(--scarlet); text-transform: uppercase; display: block;
  }
  .hero h1{ font-size: clamp(38px, 6vw, 62px); line-height: 0.98; }
  .hero h1 em{ font-style: normal; color: var(--scarlet); }
  .hero p.lede{ color: var(--ink-soft); font-size: 17px; max-width: 46ch; margin-top: 18px; }
  .hero-cta{ display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
  @media (max-width: 420px){
    .hero-cta{ flex-direction: column; }
    .hero-cta .btn{ width: 100%; justify-content: center; }
  }
  .btn{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 14px;
    text-decoration: none; border: 1px solid transparent; cursor: pointer;
  }
  .btn-solid{ background: var(--scarlet); color: var(--scarlet-ink); }
  .btn-solid:hover{ filter: brightness(1.08); }
  .btn-outline{ border-color: var(--line); color: var(--ink); background: transparent; }
  .btn-outline:hover{ border-color: var(--scarlet); color: var(--scarlet); }

  .gauge-panel{
    position: relative; border-radius: 22px; overflow: hidden;
    background: var(--garnet); box-shadow: var(--shadow);
    aspect-ratio: 4 / 3.2; max-height: 340px;
  }
  .gauge-panel canvas{ width: 100%; height: 100%; display: block; }
  @media (max-width: 480px){ .gauge-panel{ max-height: 260px; } }

  /* ---------- sections ---------- */
  section{ padding-block: 44px; border-top: 1px solid var(--line); }
  section.no-rule{ border-top: none; }
  .sec-head{ display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .sec-head h2{ font-size: clamp(24px, 3.4vw, 32px); }
  .sec-head .count{ font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-soft); }
  .see-all{ font-size: 13px; font-weight: 700; color: var(--scarlet); text-decoration: none; white-space: nowrap; }
  .see-all:hover{ text-decoration: underline; }

  /* apps — icon-wall (iPod-touch-style) */
  .icon-row{ display: flex; flex-wrap: wrap; gap: 20px 16px; }
  .icon-tile{
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 76px; text-decoration: none; color: var(--ink);
  }
  .icon-glyph{
    --tile-a: var(--scarlet); --tile-b: #ff7a5c;
    width: 64px; height: 64px; border-radius: 18px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 28px;
    background: linear-gradient(160deg, var(--tile-a), var(--tile-b));
    box-shadow: 0 8px 16px -6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.16);
    transition: transform .15s;
  }
  .icon-tile:hover .icon-glyph{ transform: translateY(-2px) scale(1.05); }
  .icon-tile:active .icon-glyph{ transform: scale(.94); }
  .icon-label{
    font-size: 12px; font-weight: 600; text-align: center; max-width: 100%; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .home-screen{
    position: relative; border-radius: 28px; overflow: hidden;
    background:
      radial-gradient(120% 90% at 15% -10%, rgba(255,255,255,.16), transparent 55%),
      radial-gradient(120% 90% at 90% 110%, rgba(0,0,0,.25), transparent 60%),
      linear-gradient(160deg, var(--garnet), #7a1f2f 55%, var(--scarlet));
    padding: 26px 22px 30px; box-shadow: var(--shadow);
  }
  .home-screen-bar{
    display: flex; justify-content: space-between; align-items: baseline;
    color: rgba(255,255,255,.75); font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 24px;
  }
  .home-screen .icon-row{ gap: 26px 18px; }
  .home-screen .icon-label{ color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .home-dots{ display: flex; justify-content: center; gap: 6px; margin-top: 30px; }
  .home-dots span{ width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .home-dots span.active{ background: #fff; }

  /* invention / list rows */
  .list-rows{ display: flex; flex-direction: column; }
  .list-row{
    display: grid; grid-template-columns: 64px 1fr auto auto; align-items: center; gap: 18px;
    padding-block: 18px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink);
  }
  .list-row:first-child{ border-top: 1px solid var(--line); }
  .row-thumb{
    width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center;
    font-size: 26px; background: var(--paper-soft); border: 1px solid var(--line); overflow: hidden;
  }
  .row-title{ font-weight: 700; font-size: 16px; }
  .row-desc{ font-size: 13px; color: var(--ink-soft); margin-top: 3px; max-width: 56ch; }
  .row-price{ font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--gold); font-size: 14px; }
  .row-cta{
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--paper);
    white-space: nowrap;
  }
  @media (max-width: 560px){
    .list-row{ grid-template-columns: 48px 1fr; row-gap: 8px; }
    .row-price, .row-cta{ grid-column: 2; justify-self: start; }
  }
  .empty-note{
    margin-top: 18px; padding: 16px 18px; border: 1px dashed var(--line); border-radius: 12px;
    font-size: 13px; color: var(--ink-soft);
  }

  /* tools grid */
  .tools-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 720px){ .tools-grid{ grid-template-columns: 1fr; } }
  .tool-card{
    border: 1px solid var(--line); border-radius: 16px; padding: 22px;
    text-decoration: none; color: var(--ink); background: var(--surface);
    display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
    transition: border-color .15s, transform .15s;
  }
  .tool-card:hover{ border-color: var(--scarlet); transform: translateY(-2px); }
  .tool-icon{ font-size: 28px; }
  .tool-card h3{ font-size: 19px; text-transform: none; letter-spacing: 0; }
  .tool-card p{ font-size: 13px; color: var(--ink-soft); margin: 0; }

  /* shop */
  .filters{ display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn{
    font-size: 13px; font-weight: 700; color: var(--ink-soft); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
  }
  .filter-btn[aria-pressed="true"]{ color: #fff; background: var(--scarlet); border-color: transparent; }
  .shop-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 720px){ .shop-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px){ .shop-grid{ grid-template-columns: 1fr; } }
  .shop-card{
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface);
    text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
  }
  .shop-thumb{
    aspect-ratio: 1; display: grid; place-items: center; font-size: 34px;
    background:
      radial-gradient(circle at 30% 20%, rgba(200,30,58,0.16), transparent 60%),
      var(--paper-soft);
  }
  .shop-body{ padding: 12px 14px 16px; }
  .shop-title{ font-weight: 700; font-size: 14px; }
  .shop-meta{ display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .shop-price{ font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--gold); }
  .platform-badge{
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 3px 8px; border-radius: 999px; color: #1A0509;
  }
  .platform-badge.gumroad{ background: var(--gumroad); }
  .platform-badge.etsy{ background: var(--etsy); color: #fff; }

  /* about */
  .about-block{ margin-bottom: 30px; }
  .about-block h2{ font-size: 20px; color: var(--scarlet); margin-bottom: 10px; }
  .about-block p{ color: var(--ink-soft); font-size: 15px; max-width: 62ch; }
  .principle-list{ list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .principle-list li{
    display: flex; gap: 12px; align-items: baseline; font-size: 15px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .principle-list .mark{ color: var(--scarlet); font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; }

  /* CTA / footer */
  .cta{
    background: var(--garnet); color: #F6E9E2; border-radius: 22px;
    padding: 44px 32px; text-align: center; margin-block: 12px 44px;
  }
  .cta h2{ font-size: clamp(26px, 4vw, 40px); color: #fff; }
  .cta p{ color: #E9CFC4; margin: 12px auto 0; max-width: 46ch; }
  .cta .btn-solid{ margin-top: 22px; }
  @media (max-width: 480px){ .cta{ padding: 32px 22px; border-radius: 18px; } }

  footer{ padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .foot-row{ display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .foot-name{ font-family: "Big Shoulders Display", sans-serif; font-weight: 800; text-transform: uppercase; }
  .foot-links{ display: flex; gap: 16px; }
  .foot-links a{ color: var(--ink-soft); text-decoration: none; font-size: 13px; }
  .foot-links a:hover{ color: var(--scarlet); }
  .copyright{ color: var(--ink-soft); font-size: 12px; margin-top: 14px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="#/">
      <span class="brand-mark">SW</span>
      <span class="brand-name">Scarlet's Workshop</span>
    </a>
    <nav class="pills" id="nav-pills">
      <a href="#/" data-route="">Home</a>
      <a href="#/apps" data-route="apps">Apps</a>
      <a href="#/inventions" data-route="inventions">Inventions</a>
      <a href="#/tools" data-route="tools">Tools</a>
      <a href="#/shop" data-route="shop">Shop</a>
      <a href="#/about" data-route="about">About</a>
    </nav>
  </div>
</header>

<main id="app" class="gutter" tabindex="-1"></main>

<footer class="gutter">
  <div class="stack">
    <div class="foot-row">
      <span class="foot-name">Scarlet's Workshop</span>
      <div class="foot-links">
        <a href="mailto:owner@scarletsworkshop.live">owner@scarletsworkshop.live</a>
        <a href="#" onclick="return false" aria-label="Gumroad">Gumroad</a>
        <a href="#" onclick="return false" aria-label="Etsy">Etsy</a>
      </div>
    </div>
    <p class="copyright">© <span id="year"></span> Scarlet's Workshop. Built in the workshop.</p>
  </div>
</footer>

<script>
(function(){
  document.getElementById("year").textContent = new Date().getFullYear();

  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  }); };
  var appsClockTimer = null;

  var APPS = [
    { name: "Video → Steps", icon: "🎬", url: "https://scarlets-workshop.itch.io/video-to-steps",
      desc: "How-to videos become written guides", colors: ["#5b5bd6", "#8f8ff6"] }
  ];
  var INVENTIONS = null; /* null = still loading; [] = loaded, none live */
  var INV_WRITEUPS = [
    { title: "Video → Steps", emoji: "🎬", url: "inventions/video-to-steps/", tag: "Overview",
      desc: "How-to videos become written guides — an overview of the app." }
  ];
  var INV_TOOLS = [
    { title: "The Launch Shelf", emoji: "📚", url: "inventions/the-launch-shelf/", tag: "Playbook",
      desc: "Five businesses that reliably make money, broken into ordered phases." },
    { title: "Fleet One-Shot Builder", emoji: "🛠️", url: "inventions/fleet-one-shot-builder/", tag: "Builder",
      desc: "Commission a multi-agent Discord fleet on a VPS, one phase at a time." }
  ];
  var TOOLS = [
    { title: "168", icon: "⏳", url: "tools/168/", desc: "Interactive weekly time-budget visualizer" },
    { title: "Git Mover", icon: "🔀", url: "tools/git-mover/", desc: "Build the exact commands to move a project between machines" },
    { title: "TaskPilot", icon: "🚀", url: "tools/task-pilot/", desc: "To-do, simplified" },
    { title: "PixelPad", icon: "🎨", url: "tools/pixel-pad/", desc: "Sketch anywhere — autosaves in your browser" },
    { title: "QuickNotes", icon: "📝", url: "tools/quick-notes/", desc: "Notes that sync via a shareable link" },
    { title: "BudgetBee", icon: "🐝", url: "tools/budget-bee/", desc: "A simple money tracker" },
    { title: "LinkVault", icon: "🔗", url: "tools/link-vault/", desc: "Save your links, tag them, find them again" },
    { title: "WeatherOrb", icon: "🌤️", url: "tools/weather-orb/", desc: "A glanceable forecast" },
    { title: "SoundLoop", icon: "🎧", url: "tools/sound-loop/", desc: "An ambient sound mixer" },
    { title: "TimeSlice", icon: "⏱️", url: "tools/time-slice/", desc: "A focus timer" }
  ];
  var PRODUCTS = [
    { title: "Icon Pack Vol. 1", emoji: "◈", price: "$12", platform: "gumroad" },
    { title: "Notion Dashboard Kit", emoji: "▦", price: "$18", platform: "gumroad" },
    { title: "Procreate Brush Set", emoji: "🖌️", price: "$9", platform: "gumroad" },
    { title: "Art Print — 'Circuit'", emoji: "🖼️", price: "$24", platform: "etsy" },
    { title: "Sticker Sheet Pack", emoji: "✨", price: "$7", platform: "etsy" },
    { title: "Custom Pet Portrait", emoji: "🐾", price: "$45", platform: "etsy" }
  ];

  /* ---- card builders ---- */
  function isExternal(url){ return /^https?:\/\//i.test(url); }
  function appIcon(a){
    var style = a.colors ? ' style="--tile-a:'+esc(a.colors[0])+';--tile-b:'+esc(a.colors[1])+';"' : '';
    var target = isExternal(a.url) ? ' target="_blank" rel="noopener"' : '';
    return '<a class="icon-tile" href="'+esc(a.url)+'"'+target+' title="'+esc(a.desc)+'">'
      + '<span class="icon-glyph"'+style+'>'+a.icon+'</span>'
      + '<span class="icon-label">'+esc(a.name)+'</span></a>';
  }
  function inventionRow(v){
    var price = v.price > 0 ? "$" + (v.price/100).toFixed(2) : "—";
    var thumb = v.hero
      ? '<img src="'+esc(v.hero)+'" alt="" style="width:100%;height:100%;object-fit:cover;">'
      : (v.emoji || "🛠️");
    return '<a class="list-row" href="inventions/'+esc(v.slug)+'/">'
      + '<span class="row-thumb">'+thumb+'</span>'
      + '<span><span class="row-title">'+esc(v.name)+'</span>'
      + '<div class="row-desc">'+esc(v.tagline||"")+'</div></span>'
      + '<span class="row-price mono">'+price+'</span>'
      + '<span class="row-cta">View</span></a>';
  }
  function writeupRow(w){

  function inventionsListHTML(items){
    if (items === null) return '<p class="empty-note">Loading inventions…</p>';

  function toolCard(t){

  function shopCard(p){

  var ctaBlock =
    '<section class="stack no-rule">'
      + '<div class="cta">'
        + '<h2>Got something to build?</h2>'
        + '<p>Commission a one-off invention, request an app, or just say hi — replies come from the workshop, not a bot.</p>'
        + '<a class="btn btn-solid" href="mailto:owner@scarletsworkshop.live">Email the workshop</a>'
      + '</div>'
    + '</section>';

  /* ---- route templates ---- */
  var routes = {

    "": {
      title: "Scarlet's Workshop",
      render: function(){
        return ''
          + '<section class="hero stack no-rule">'
            + '<div class="hero-grid">'
              + '<div>'
                + '<span class="eyebrow">Apps · Art · Webpages</span>'
                + '<h1>Built to be <em>used</em>,<br>not just admired.</h1>'
                + '<p class="lede">Scarlet\'s Workshop makes apps, art, and webpages that are convenient to use — plus a few physical inventions you can bolt straight to a job site.</p>'
                + '<div class="hero-cta">'
                  + '<a class="btn btn-solid" href="#/inventions">Shop inventions</a>'
                  + '<a class="btn btn-outline" href="#/apps">See the apps</a>'
                + '</div>'
              + '</div>'
              + '<div class="gauge-panel"><canvas id="gauge" aria-label="Illustrated workshop gauge and blueprint grid" role="img"></canvas></div>'

          + '</section>'

          + '<section class="stack">'
            + '<div class="sec-head"><h2>Apps</h2><a class="see-all" href="#/apps">Open the app wall →</a></div>'

          + '<section class="stack">'

          + '<section class="stack">'
            + '<div class="sec-head"><h2>Shop</h2><a class="see-all" href="#/shop">See all ' + PRODUCTS.length + ' →</a></div>'

    "apps": {
      title: "Apps — Scarlet's Workshop",
      render: function(){
        return ''
          + '<div class="stack page-head"><span class="eyebrow">' + APPS.length + ' installed</span><h1>App wall</h1><p>Full apps ship outside the workshop — starting with Video → Steps on itch.io.</p></div>'
          + '<section class="stack no-rule">'
            + '<div class="home-screen">'
              + '<div class="home-screen-bar"><span>Scarlet\'s Workshop</span><span id="home-clock"></span></div>'
              + '<div class="icon-row">' + APPS.map(appIcon).join("") + '</div>'

      afterRender: function(){

          var now = new Date();
          clockEl.textContent = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");

    "inventions": {
      title: "Inventions — Scarlet's Workshop",
      render: function(){
        return ''
          + '<div class="stack page-head"><span class="eyebrow">CAD · STL · PDF downloads</span><h1>Inventions</h1><p>Physical tools designed in the workshop, sold as downloadable build files — print or machine them yourself.</p></div>'
          + '<section class="stack no-rule">'
            + inventionsListHTML(INVENTIONS)
          + '</section>'
          + '<section class="stack">'
            + '<div class="sec-head"><h2>Write-ups</h2></div>'
            + '<div class="list-rows">' + INV_WRITEUPS.map(writeupRow).join("") + '</div>'
          + '</section>'
          + '<section class="stack">'
            + '<div class="sec-head"><h2>Tools</h2></div>'
            + '<div class="list-rows">' + INV_TOOLS.map(writeupRow).join("") + '</div>'
          + '</section>'
          + ctaBlock;
      }
    },

    "tools": {
      title: "Tools — Scarlet's Workshop",
      render: function(){
        return ''
          + '<div class="stack page-head"><span class="eyebrow">' + TOOLS.length + ' live</span><h1>Webpage tools</h1><p>Free, no-signup tools built for one job each.</p></div>'
          + '<section class="stack no-rule"><div class="tools-grid">' + TOOLS.map(toolCard).join("") + '</div></section>'
          + ctaBlock;
      }
    },

    "shop": {
      title: "Shop — Scarlet's Workshop",
      render: function(){
        return ''
          + '<div class="stack page-head"><span class="eyebrow">Gumroad &amp; Etsy</span><h1>Shop</h1><p>Digital packs and physical prints, sold off-site on Gumroad and Etsy.</p></div>'
          + '<section class="stack no-rule">'
            + '<div class="filters" id="shop-filters">'
              + '<button class="filter-btn" data-filter="all" aria-pressed="true">All</button>'
              + '<button class="filter-btn" data-filter="gumroad" aria-pressed="false">Gumroad</button>'
              + '<button class="filter-btn" data-filter="etsy" aria-pressed="false">Etsy</button>'
            + '</div>'
            + '<div class="shop-grid" id="shop-grid">' + PRODUCTS.map(shopCard).join("") + '</div>'
          + '</section>'
          + ctaBlock;
      },
      afterRender: function(){
        var filters = document.getElementById("shop-filters");
        var grid = document.getElementById("shop-grid");
        if (!filters) return;
        filters.addEventListener("click", function(e){
          var btn = e.target.closest(".filter-btn");
          if (!btn) return;
          filters.querySelectorAll(".filter-btn").forEach(function(b){ b.setAttribute("aria-pressed", "false"); });
          btn.setAttribute("aria-pressed", "true");
          var f = btn.dataset.filter;
          var items = f === "all" ? PRODUCTS : PRODUCTS.filter(function(p){ return p.platform === f; });
          grid.innerHTML = items.map(shopCard).join("");
        });
      }
    },

    "about": {
      title: "About — Scarlet's Workshop",
      render: function(){
        return ''
          + '<div class="stack-narrow page-head"><span class="eyebrow">The studio</span><h1>About the workshop</h1></div>'
          + '<section class="stack-narrow no-rule">'
            + '<div class="about-block">'
              + '<h2>What this is</h2>'
              + '<p>Scarlet\'s Workshop is one person\'s bench: apps, art, webpages and a few physical inventions, all made because they were fun or useful to build. Everything here ships as its own small, focused thing rather than one sprawling product.</p>'
            + '</div>'
            + '<div class="about-block">'
              + '<h2>How it\'s built</h2>'
              + '<p>Every app, tool and invention page lives in its own folder and becomes its own web address automatically — no build step, no CMS. That\'s deliberate: it keeps each creation small enough to finish and easy to find again.</p>'
              + '<ul class="principle-list">'
                + '<li><span class="mark">01</span><span>One folder, one URL — nothing is buried behind a router.</span></li>'
                + '<li><span class="mark">02</span><span>Free tools stay free; inventions ship with real CAD/STL/PDF files, not just a render.</span></li>'
                + '<li><span class="mark">03</span><span>If it\'s not convenient to use, it\'s not finished.</span></li>'
              + '</ul>'
            + '</div>'
            + '<div class="about-block">'
              + '<h2>Say hello</h2>'
              + '<p>Commission requests, bug reports, and "can you make this" ideas are all welcome at <a href="mailto:owner@scarletsworkshop.live" style="color:var(--scarlet);font-weight:600;">owner@scarletsworkshop.live</a>.</p>'
            + '</div>'
          + '</section>';
      }
    }
  };

  /* ---- blueprint gauge canvas (home only) ---- */
  function initGauge(){
    var canvas = document.getElementById("gauge");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var t0 = performance.now();

    function resize(){
      var rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
    }

    function draw(now){
      if (!document.body.contains(canvas)) { return; }
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = "#4B0D1B";
      ctx.fillRect(0, 0, w, h);

      var step = 26 * dpr;
      ctx.strokeStyle = "rgba(255,255,255,0.055)";
      ctx.lineWidth = 1;
      for (var x = 0; x <= w; x += step){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (var y = 0; y <= h; y += step){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      var pad = 22 * dpr, arm = 14 * dpr;
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 1.5 * dpr;
      [[pad,pad],[w-pad,pad],[pad,h-pad],[w-pad,h-pad]].forEach(function(c){
        ctx.beginPath(); ctx.moveTo(c[0]-arm, c[1]); ctx.lineTo(c[0]+arm, c[1]); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c[0], c[1]-arm); ctx.lineTo(c[0], c[1]+arm); ctx.stroke();
      });

      var cx = w/2, cy = h/2, r = Math.min(w,h) * 0.30;
      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r*0.7, 0, Math.PI*2); ctx.stroke();

      var ticks = 24;
      for (var i=0; i<ticks; i++){
        var a = (i/ticks) * Math.PI*2;
        var major = i % 6 === 0;
        var inner = r * (major ? 0.78 : 0.85);
        var outer = r * 1.0;
        ctx.strokeStyle = major ? "rgba(255,255,255,0.75)" : "rgba(255,255,255,0.3)";
        ctx.lineWidth = (major ? 2 : 1) * dpr;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a)*inner, cy + Math.sin(a)*inner);
        ctx.lineTo(cx + Math.cos(a)*outer, cy + Math.sin(a)*outer);
        ctx.stroke();
      }

      var elapsed = reduceMotion ? 0 : (now - t0) / 1000;
      var sweep = (Math.sin(elapsed * 0.35) * 0.5 + 0.5);
      var needleAngle = -Math.PI*0.75 + sweep * Math.PI*1.5;
      ctx.strokeStyle = "#FF4A63";
      ctx.lineWidth = 2.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(needleAngle)*r*0.62, cy + Math.sin(needleAngle)*r*0.62);
      ctx.stroke();
      ctx.fillStyle = "#FF4A63";
      ctx.beginPath(); ctx.arc(cx, cy, 4*dpr, 0, Math.PI*2); ctx.fill();

      ctx.save();
      ctx.translate(w*0.16, h*0.82);
      ctx.rotate(-0.5);
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 5*dpr; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-16*dpr, 0); ctx.lineTo(16*dpr, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(-16*dpr, 0, 8*dpr, Math.PI*0.25, Math.PI*1.75); ctx.stroke();
      ctx.beginPath(); ctx.arc(16*dpr, 0, 8*dpr, Math.PI*1.25, Math.PI*0.75); ctx.stroke();
      ctx.restore();

      if (!reduceMotion){ requestAnimationFrame(draw); }
    }

    resize();
    draw(performance.now());
    window.addEventListener("resize", function(){ resize(); if (reduceMotion) draw(performance.now()); });
  }

  /* ---- router ---- */
  var app = document.getElementById("app");
  function currentRoute(){
    var h = location.hash.replace(/^#\/?/, "");
    return routes[h] ? h : "";
  }
  function render(){
    var key = currentRoute();
    var route = routes[key];
    app.innerHTML = route.render();
    document.title = route.title;
    document.querySelectorAll("#nav-pills a").forEach(function(a){
      if (a.dataset.route === key) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    app.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    if (route.afterRender) route.afterRender();
  }
  window.addEventListener("hashchange", render);
  render();

  fetch("inventions/catalog.json", { cache: "no-cache" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      INVENTIONS = (data && Array.isArray(data.inventions)) ? data.inventions : [];
      var key = currentRoute();
      if (key === "" || key === "inventions") render();
    })
    .catch(function(){ INVENTIONS = []; });
})();
</script>
